services:
  backend:
    build: ./backend
    environment:
      DATA_DIR: /data
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DEFAULT_CUTOFF: ${DEFAULT_CUTOFF:-09:20}
    volumes:
      - windmarket-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  windmarket-data:
